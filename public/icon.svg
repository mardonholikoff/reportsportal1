  <circle cx="256" cy="256" r="180" fill="#FFFFFF" filter="url(#shadow)" />
  <!-- Accent emblem -->
  <rect x="146" y="146" width="220" height="220" rx="44" fill="url(#accent)" />
  <!-- Modern Ledger & User Icon in pure crisp white -->
  <path d="M200 190h112c8.8 0 16 7.2 16 16v100c0 8.8-7.2 16-16 16H200c-8.8 0-16-7.2-16-16V206c0-8.8 7.2-16 16-16z" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M224 230h64M224 266h40" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <!-- Debt/Credit balance symbol -->
  <circle cx="296" cy="286" r="18" fill="#FEE2E2" stroke="#BE123C" stroke-width="6"/>
